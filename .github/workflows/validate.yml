name: validate-skill

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure
        run: python .agents/skills/arab-writer/scripts/validate_skill.py
      - name: Compile Python helpers
        run: python -m compileall -q .agents/skills/arab-writer/scripts evals tests
      - name: Run deterministic regression tests
        run: python -m unittest discover -s tests -v
      - name: Smoke composite fidelity QA
        run: python .agents/skills/arab-writer/scripts/qa_pair.py tests/fixtures/before.txt tests/fixtures/after.txt
